name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (transformers ${{ matrix.transformers }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        transformers: ["4.46.3", "5.24.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==${{ matrix.transformers }}" safetensors numpy pytest
      - name: Tests
        run: python -m pytest -q
      - name: Gemini's own round-trip check
        run: python verify_hf_roundtrip.py
